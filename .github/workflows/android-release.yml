name: Android Release

# Builds the NxMirror Android APK directly with Gradle on GitHub runners.
# No Expo account, no EAS, no cloud build service is used at any step.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Run Expo Prebuild (native project generation)
        run: npx expo prebuild --platform android --no-install

      - name: Build Android release APK with Gradle
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK exists and check size
        id: verify
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not produced by the Gradle build."
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "APK size: ${SIZE_MB} MB (${SIZE} bytes)"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "::error::APK is suspiciously small (${SIZE} bytes) — failing."
            exit 1
          fi
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxMirror-Android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          ASSET="NxMirror-Android-${TAG}.apk"
          cp "$APK" "$ASSET"
          cat > release-notes.md <<'NOTES'
          ## NxMirror Android

          Native Android app (React Native + Expo) for the NxMirror package registry, cloud files, Git cloud and NxDB.

          ### What is inside
          - **Registry** — public npm-like package catalog: no-login search, details, versions and artifact download
          - **Cloud Files** — personal file manager with chunked uploads, folders, rename, delete and download
          - **Git Cloud** — repositories, commits, file browsing, star, fork, ZIP export
          - **NxDB** — account databases, SQL console and object storage overview
          - **Liquid Glass UI** — dark/light glassmorphism design system with skeleton loading everywhere
          - Real backend integration only — every screen talks to the live NxMirror API (no fake data)

          ### Signing notice
          This APK is **signed with the development (debug) key** because release signing
          secrets are not configured in this repository. It installs fine on devices and
          emulators, but it is **not** a production Play-Store signature. See
          `docs/RELEASE.md` for how to configure production signing.

          ### Install
          Download `NxMirror-Android-<version>.apk` below, allow "Install unknown apps"
          for your browser/file manager if asked, and install.
          NOTES
          sed -i "s/<version>/${TAG}/g" release-notes.md
          gh release create "$TAG" "$ASSET" \
            --title "NxMirror Android ${TAG}" \
            --notes-file release-notes.md \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
